name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: true
      matrix:
        php: ["8.3"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: dukaan_os_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: dukaan_os_test
      DB_USERNAME: root
      DB_PASSWORD: ""

    steps:
      # ── Checkout ────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v7

      # ── PHP ─────────────────────────────────────────────────
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, bcmath, intl
          coverage: none

      # ── Composer cache ───────────────────────────────────────
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # ── Install PHP dependencies ─────────────────────────────
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # ── Node / npm cache ─────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      # ── Build frontend assets ────────────────────────────────
      - name: Build frontend (Bootstrap 5)
        run: npm run build

      # ── Laravel Pint (style gate) ────────────────────────────
      - name: Run Laravel Pint (lint check)
        run: ./vendor/bin/pint --test

      # ── Prepare Laravel for tests ────────────────────────────
      - name: Copy .env.example → .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Wait for MySQL to be ready
        run: |
          for i in $(seq 1 30); do
            mysql -h 127.0.0.1 -uroot -e "SELECT 1" 2>/dev/null && break
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Run database migrations
        run: php artisan migrate --force

      # ── PHPUnit test suite ───────────────────────────────────
      - name: Run PHPUnit tests
        run: php artisan test
